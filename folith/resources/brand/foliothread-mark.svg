<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 268" role="img" aria-labelledby="title desc">
  <!--
    FolioThread 唯一 logo（彩色）。本文件是品牌的向量真源：
    folith/resources/brand/ 下的 PNG 全部由 scripts/render_brand_assets.py
    从这里渲染生成，不要手工替换位图。改色/改形请同步 docs/brand.md 与
    app.py 的 :root 品牌 token，然后重新生成位图。
  -->
  <title id="title">FolioThread mark</title>
  <desc id="desc">Two stacked document pages marked 文 and A, crossed by a pointer cursor: agentic translation.</desc>
  <defs>
    <linearGradient id="ftPage" x1="72" y1="146" x2="292" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0052FE"/>
      <stop offset=".32" stop-color="#0088FD"/>
      <stop offset=".7" stop-color="#00BEFE"/>
      <stop offset="1" stop-color="#00E8FE"/>
    </linearGradient>
    <!-- 前页右上角的高光：设计稿里那块偏白的亮部 -->
    <radialGradient id="ftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(276 30) rotate(90) scale(96 120)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 后页：纯钴蓝，向左下错位 -->
  <rect x="3.467" y="25.445" width="183" height="236" rx="52"
        fill="#004CFD" transform="rotate(12 94.967 143.445)"/>
  <!-- 前页：横向渐变 + 右上角高光，向右上错位 -->
  <g transform="rotate(12 169.967 123.445)">
    <rect x="78.467" y="5.445" width="183" height="236" rx="52" fill="url(#ftPage)"/>
    <rect x="78.467" y="5.445" width="183" height="236" rx="52" fill="url(#ftGlow)"/>
  </g>
  <!-- 前页左上角的「文」 -->
  <text x="100" y="54" fill="#FFFFFF" fill-opacity=".9" text-anchor="middle"
        transform="translate(0 15.5) scale(0.7 1)"
        font-family="Manrope, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
        font-size="48" font-weight="500">文</text>
  <!-- 指针光标：Heroicons 的 cursor-arrow-rays，去掉四周射线只留指针本体 -->
  <path fill="#FFFFFF" transform="translate(-50 34) scale(9.4) rotate(-25.5)"
        d="M11.5484 8.63179C11.8602 8.54824 12.1905 8.67359 12.3684 8.94299L17.5955 16.8599C17.7627 17.113 17.7609 17.4419 17.591 17.6932C17.421 17.9445 17.1165 18.0687 16.8193 18.0079L14.722 17.5787L15.7668 21.4777C15.874 21.8778 15.6365 22.289 15.2364 22.3963C14.8363 22.5035 14.4251 22.266 14.3179 21.8659L13.2732 17.967L11.6717 19.3872C11.4447 19.5884 11.1189 19.6332 10.8461 19.5005C10.5733 19.3678 10.4073 19.0839 10.4254 18.7811L10.9939 9.3113C11.0132 8.98905 11.2366 8.71534 11.5484 8.63179Z"/>
  <!-- 后页右下角的「A」 -->
  <text x="184" y="196" fill="#FFFFFF" fill-opacity=".95" text-anchor="middle"
        font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="41" font-weight="600">A</text>
</svg>
