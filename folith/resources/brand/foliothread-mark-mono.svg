<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 268" role="img" aria-labelledby="title desc">
  <!--
    FolioThread 唯一 logo（单色）。形状与 foliothread-mark.svg 完全一致，
    只有「一个颜色 + 背景色」：页面用 currentColor 的透明度分层，
    文 / A / 光标是从前页打穿的镂空。适合单色印刷或跟随前景色的场景。
  -->
  <title id="title">FolioThread mark (monochrome)</title>
  <desc id="desc">Two stacked document pages marked 文 and A, crossed by a pointer cursor. Single-colour variant.</desc>
  <!-- 单色版：只有背景色 + currentColor。两页用透明度分层，
       文/A/光标是用背景色打穿前页得到的镂空。 -->
  <defs>
    <mask id="ftMonoKnockout" maskUnits="userSpaceOnUse" x="0" y="0" width="274" height="268">
      <rect width="274" height="268" fill="#fff"/>
      <g fill="#000">
        <text x="100" y="54" text-anchor="middle" transform="translate(0 15.5) scale(0.7 1)"
              font-family="Manrope, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
              font-size="48" font-weight="500">文</text>
        <text x="184" y="196" text-anchor="middle"
              font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"
              font-size="41" font-weight="600">A</text>
        <path fill-rule="evenodd" transform="translate(-50 34) scale(9.4) rotate(-25.5)"
              d="M11.5484 8.63179C11.8602 8.54824 12.1905 8.67359 12.3684 8.94299L17.5955 16.8599C17.7627 17.113 17.7609 17.4419 17.591 17.6932C17.421 17.9445 17.1165 18.0687 16.8193 18.0079L14.722 17.5787L15.7668 21.4777C15.874 21.8778 15.6365 22.289 15.2364 22.3963C14.8363 22.5035 14.4251 22.266 14.3179 21.8659L13.2732 17.967L11.6717 19.3872C11.4447 19.5884 11.1189 19.6332 10.8461 19.5005C10.5733 19.3678 10.4073 19.0839 10.4254 18.7811L10.9939 9.3113C11.0132 8.98905 11.2366 8.71534 11.5484 8.63179Z"/>
      </g>
    </mask>
  </defs>
  <g fill="currentColor">
    <rect x="3.467" y="25.445" width="183" height="236" rx="52" fill-opacity=".34"
          transform="rotate(12 94.967 143.445)"/>
    <g mask="url(#ftMonoKnockout)">
      <rect x="78.467" y="5.445" width="183" height="236" rx="52" fill-opacity=".78"
            transform="rotate(12 169.967 123.445)"/>
    </g>
  </g>
</svg>
