<circle cx="532" cy="62" r="15" fill="#2f6fed"/><text x="532" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
<text x="556" y="68" font-size="21" font-weight="700" fill="#1f2937">审校</text>
<text x="520" y="104" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• 独立审校模型逐段检查</tspan></text>
<text x="520" y="148" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• 跨段对照相邻译文</tspan></text>
<text x="520" y="192" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• 问题分级：仅阻断项拦交付</tspan></text>
<line x1="718" y1="135" x2="742" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="744" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="772" cy="62" r="15" fill="#2f6fed"/><text x="772" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
<text x="796" y="68" font-size="21" font-weight="700" fill="#1f2937">交付</text>
<text x="760" y="104" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• 交付门禁核验完整性</tspan></text>
<text x="760" y="148" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• 冻结为不可变版本</tspan></text>
<text x="760" y="192" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• 译文 · 双语 · 术语 ·</tspan><tspan x="772" dy="16"> 记忆 · 清单</tspan></text>
