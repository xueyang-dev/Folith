<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Folith 工作流程" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
