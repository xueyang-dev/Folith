<rect x="264" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="292" cy="62" r="15" fill="#2f6fed"/><text x="292" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
<text x="316" y="68" font-size="21" font-weight="700" fill="#1f2937">翻译</text>
<text x="280" y="104" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• 快速 / 标准 / 精细三种</tspan><tspan x="292" dy="16">模式</tspan></text>
<text x="280" y="148" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• 带前后文与锁定术语分批</tspan></text>
<text x="280" y="192" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• 进度落盘，可暂停继续</tspan></text>
<line x1="478" y1="135" x2="502" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
