<circle cx="52" cy="62" r="15" fill="#2f6fed"/><text x="52" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
<text x="76" y="68" font-size="21" font-weight="700" fill="#1f2937">准备</text>
<text x="40" y="104" font-size="12.5" fill="#374151"><tspan x="40" dy="0">• 提取段落、去除页眉页脚</tspan></text>
