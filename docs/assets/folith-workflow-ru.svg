<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Рабочий процесс Folith" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1000" height="380" rx="14" fill="#f6f7f9"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect x="24" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="52" cy="62" r="15" fill="#2f6fed"/><text x="52" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
<text x="76" y="68" font-size="21" font-weight="700" fill="#1f2937">Подготовка</text>
<text x="40" y="104" font-size="12.5" fill="#374151"><tspan x="40" dy="0">• Извлечение сегментов, без</tspan><tspan x="52" dy="16">колонтитулов</tspan></text>
<text x="40" y="148" font-size="12.5" fill="#374151"><tspan x="40" dy="0">• Сканы читает модель зрения</tspan></text>
<text x="40" y="192" font-size="12.5" fill="#374151"><tspan x="40" dy="0">• Профиль · кандидаты в</tspan><tspan x="52" dy="16">термины</tspan></text>
<line x1="238" y1="135" x2="262" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="264" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="292" cy="62" r="15" fill="#2f6fed"/><text x="292" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
<text x="316" y="68" font-size="21" font-weight="700" fill="#1f2937">Перевод</text>
<text x="280" y="104" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• Режимы: быстрый /</tspan><tspan x="292" dy="16">стандартный / тщательный</tspan></text>
<text x="280" y="148" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• Пакеты с контекстом и</tspan><tspan x="292" dy="16">терминами</tspan></text>
<text x="280" y="192" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• Прогресс сохраняется, можно</tspan><tspan x="292" dy="16">продолжить</tspan></text>
<line x1="478" y1="135" x2="502" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="504" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="532" cy="62" r="15" fill="#2f6fed"/><text x="532" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
<text x="556" y="68" font-size="21" font-weight="700" fill="#1f2937">Проверка</text>
<text x="520" y="104" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• Отдельный рецензент</tspan><tspan x="532" dy="16">проверяет сегменты</tspan></text>
<text x="520" y="148" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• Сверка с соседними</tspan><tspan x="532" dy="16">переводами</tspan></text>
<text x="520" y="192" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• Блокирующие проблемы</tspan><tspan x="532" dy="16">останавливают сдачу</tspan></text>
<line x1="718" y1="135" x2="742" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="744" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="772" cy="62" r="15" fill="#2f6fed"/><text x="772" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
<text x="796" y="68" font-size="21" font-weight="700" fill="#1f2937">Сдача</text>
<text x="760" y="104" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• Контроль полноты</tspan></text>
<text x="760" y="148" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• Неизменяемая</tspan><tspan x="772" dy="16">зафиксированная версия</tspan></text>
<text x="760" y="192" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• Перевод · двуязычная копия</tspan><tspan x="772" dy="16">· термины · манифест</tspan></text>
<path d="M 640 244 C 640 276, 520 276, 520 246" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="580" y="284" text-anchor="middle" font-size="12" fill="#4b5563">Ручная правка → повторная проверка</text>
<rect x="24" y="304" width="952" height="52" rx="10" fill="#e8f0fe" stroke="#b6cdf8"/>
<text x="500" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Ресурсы проекта: термбаза + память переводов (по проектам; проверенные пары возвращаются)</text>
</svg>
