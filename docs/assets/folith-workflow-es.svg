<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs>
<rect x="24" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="52" cy="62" r="15" fill="#2f6fed"/><text x="52" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
<text x="76" y="68" font-size="21" font-weight="700" fill="#1f2937">Preparar</text>
<text x="40" y="104" font-size="12.5" fill="#374151"><tspan x="40" dy="0">• Extraer segmentos, sin</tspan><tspan x="52" dy="16">encabezados</tspan></text>
<text x="40" y="148" font-size="12.5" fill="#374151"><tspan x="40" dy="0">• Escaneos leídos por el</tspan><tspan x="52" dy="16">modelo de visión</tspan></text>
<text x="40" y="192" font-size="12.5" fill="#374151"><tspan x="40" dy="0">• Perfil · candidatos a</tspan><tspan x="52" dy="16">término</tspan></text>
<line x1="238" y1="135" x2="262" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
