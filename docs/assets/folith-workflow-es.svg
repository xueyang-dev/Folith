<text x="316" y="68" font-size="21" font-weight="700" fill="#1f2937">Traducir</text>
<text x="280" y="104" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• Modos Rápido / Estándar /</tspan><tspan x="292" dy="16">Exhaustivo</tspan></text>
<text x="280" y="148" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• Lotes con contexto y</tspan><tspan x="292" dy="16">términos fijos</tspan></text>
<text x="280" y="192" font-size="12.5" fill="#374151"><tspan x="280" dy="0">• Progreso guardado,</tspan><tspan x="292" dy="16">reanudable</tspan></text>
<line x1="478" y1="135" x2="502" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="504" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="532" cy="62" r="15" fill="#2f6fed"/><text x="532" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
<text x="556" y="68" font-size="21" font-weight="700" fill="#1f2937">Revisar</text>
<text x="520" y="104" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• Un revisor aparte comprueba</tspan><tspan x="532" dy="16">cada segmento</tspan></text>
<text x="520" y="148" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• Compara traducciones</tspan><tspan x="532" dy="16">vecinas</tspan></text>
<text x="520" y="192" font-size="12.5" fill="#374151"><tspan x="520" dy="0">• Solo los problemas</tspan><tspan x="532" dy="16">bloqueantes detienen</tspan></text>
<line x1="718" y1="135" x2="742" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="744" y="28" width="212" height="214" rx="12" fill="#fff" stroke="#d5d9e0"/>
<circle cx="772" cy="62" r="15" fill="#2f6fed"/><text x="772" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
<text x="796" y="68" font-size="21" font-weight="700" fill="#1f2937">Entregar</text>
<text x="760" y="104" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• La puerta verifica la</tspan><tspan x="772" dy="16">integridad</tspan></text>
<text x="760" y="148" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• Versión inmutable congelada</tspan></text>
<text x="760" y="192" font-size="12.5" fill="#374151"><tspan x="760" dy="0">• Traducción · bilingüe ·</tspan><tspan x="772" dy="16">términos · manifiesto</tspan></text>
