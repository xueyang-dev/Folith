name: Linux test environment
description: Python, the Qt offscreen runtime libraries and the test dependencies used by every Linux regression job.
inputs:
  python-version:
    description: Python version to install
    default: "3.11"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install test tools
      # QtGui/offscreen still links EGL, GL, keyboard, font and D-Bus runtimes.
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes ripgrep libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install test dependencies
      # 6.12.0 crashes during Qt test teardown and its macOS bindings require
      # macOS 26; use the runtime verified for the macOS 15 release candidate.
      shell: bash
      run: python -m pip install --upgrade pip && python -m pip install ".[test]" PySide6==6.11.2
