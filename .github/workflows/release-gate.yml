name: Release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        # QtGui/offscreen still links EGL, GL, keyboard, font and D-Bus runtimes.
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install test dependencies
        # 6.12.0 crashes during Qt test teardown and its macOS bindings require
        # macOS 26; use the runtime verified for the macOS 15 release candidate.
        run: python -m pip install --upgrade pip && python -m pip install ".[test]" PySide6==6.11.2
      - name: Compile and import critical modules
        run: |
          python -m py_compile app.py core.py folith/academic_writer.py \
            folith/compliance.py folith/thesis_constraints.py
          python - <<'PY'
          import folith.academic_writer
          import folith.compliance
          import folith.thesis_constraints

          print("critical module compile/import: OK")
          PY
      - name: Check complete UI catalogs
        run: python scripts/check_ui_locales.py
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_regression.py --tsv release-regression.tsv
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-python-${{ matrix.python-version }}
          path: |
            .regression-logs/
            release-regression.tsv
          include-hidden-files: true
          if-no-files-found: ignore

  package:
    name: build and wheel smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Inspect release archives
        run: |
          python scripts/check_release_archives.py dist
          python scripts/release_preflight.py --dist dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/folith"
          "$RUNNER_TEMP/folith/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/folith/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/folith/bin/python" - <<'PY'
          from pathlib import Path
          import app
          import core
          import gui
          import folith

          assert Path(gui.ROOT, "app.py").is_file()
          assert Path(gui.ROOT, "folith", "resources", "en_common.txt").is_file()
          assert Path(gui.ROOT, "folith", "resources", "brand", "folith-favicon.svg").is_file()
          assert Path(gui.ROOT, "folith", "resources", "brand", "folith-mark.svg").is_file()
          assert Path(gui.ROOT, "folith", "resources", "brand", "folith-lockup.png").is_file()
          assert Path(gui.ROOT, "folith", "resources", "brand", "folith-mark.png").is_file()
          print("installed imports and resources: OK")
          PY
          "$RUNNER_TEMP/folith/bin/folith" --help
          "$RUNNER_TEMP/folith/bin/python" "$GITHUB_WORKSPACE/scripts/release_smoke.py"

  desktop-macos:
    name: macOS desktop build and release checks
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          # pikepdf source builds need external qpdf headers. Prefer a published
          # wheel (including an older compatible release) for this test extra.
          python -m pip install --only-binary=pikepdf ".[test]"
          python -m pip install -r requirements-desktop.txt
          python -m pip install -r requirements-desktop-build.txt
      - name: Install the OCR engine used to stage the bundled payload
        run: brew install tesseract
      - name: Build the desktop bundle
        run: FOLITH_BUILD_PYTHON="$(command -v python)" bash scripts/build_desktop.sh
      - name: Desktop gate (frozen app, handshake, lifecycle, diagnostics)
        env:
          FOLITH_D0_FROZEN_GUI: "1"
          FOLITH_DESKTOP_FROZEN_APP: ${{ github.workspace }}/dist/desktop/Folith.app/Contents/MacOS/Folith
        run: |
          python -m pytest tests/desktop_handshake_test.py tests/desktop_frozen_test.py             tests/desktop_single_instance_test.py tests/desktop_exit_flow_test.py             tests/desktop_diagnostics_test.py tests/desktop_legacy_import_test.py             tests/desktop_tool_discovery_test.py tests/desktop_app_identity_test.py             tests/desktop_file_actions_test.py tests/desktop_dmg_test.py             tests/desktop_release_plumbing_test.py tests/desktop_release_checks_test.py             tests/desktop_release_notes_test.py tests/gui_launcher_test.py -q
      - name: Build the DMG
        run: bash scripts/build_dmg.sh
      - name: Install browser automation for the desktop sweep
        run: |
          npm install --prefix "$RUNNER_TEMP/folith-browser" --no-audit --no-fund playwright-core@1.64.0
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          echo "FOLIO_PLAYWRIGHT_CORE=$RUNNER_TEMP/folith-browser/node_modules/playwright-core" >> "$GITHUB_ENV"
          echo "FOLIO_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
      - name: End-to-end reproducibility sweep
        env:
          FOLITH_DESKTOP_FROZEN_APP: ${{ github.workspace }}/dist/desktop/Folith.app/Contents/MacOS/Folith
        run: python scripts/desktop_e2e_sweep.py --skip-slow
      - name: Upload failed desktop sweep diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folith-desktop-sweep-diagnostics
          path: build/desktop/e2e-sweep/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Release checks and manifest
        run: |
          python scripts/release_checks.py --mount --out build/desktop/release-manifest.json
          python scripts/release_notes.py
      - name: Verify the release notes match the manifest
        run: python scripts/release_notes.py --check
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folith-macos-desktop
          path: |
            dist/desktop/*.dmg
            build/desktop/release-manifest.json
            build/desktop/dmg_record.json
            build/desktop/e2e-sweep/sweep.json
          if-no-files-found: error

  qt-macos:
    # The Qt candidate is built in one interpreter environment: the same venv
    # that runs the tests, builds the app, the DMG, the manifest and the notes.
    # The retired shell's chain installed dependencies with setup-python and then
    # called a script expecting $ROOT/venv (MAC-03), so this job creates the venv
    # it uses and installs the real desktop dependency set.
    name: macOS Qt candidate (build, frozen flow, DMG, release checks)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create the build interpreter and install dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m pip install -r requirements-desktop-build.txt PySide6==6.11.2 "pytest>=8,<9"
      - name: Install the OCR engine used to stage the bundled payload
        run: brew install tesseract
      - name: Build the Qt bundle
        run: bash scripts/build_qt_desktop.sh
      - name: Frozen main flow (import/translate/edit/review/deliver/exit/reopen)
        run: |
          venv/bin/python scripts/qt_desktop_probe.py \
            --data-dir "$RUNNER_TEMP/qt-probe/data" \
            --out "$RUNNER_TEMP/qt-probe/report.json" --fixture both \
            --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith"
      - name: Frozen bundled OCR baseline (eng/chi_sim/ara, no Homebrew on PATH)
        run: |
          venv/bin/python scripts/qt_ocr_baseline_runner.py \
            --out "$RUNNER_TEMP/qt-ocr" \
            --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith"
      - name: Build the DMG
        run: bash scripts/build_qt_dmg.sh
      - name: Release manifest and generated notes for this candidate
        run: |
          venv/bin/python scripts/qt_release_checks.py --write
          venv/bin/python scripts/qt_release_checks.py --write-notes
          venv/bin/python scripts/qt_release_checks.py --check-notes
      - name: Candidate documents and isolated Qt regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          venv/bin/python scripts/qt_acceptance_kit.py --write
          venv/bin/python scripts/qt_acceptance_kit.py --check
          venv/bin/python scripts/run_regression.py -k qt_,text_import --tsv qt-regression.tsv
      - name: New source formats in the frozen main flow
        run: |
          for format in epub txt md; do
            venv/bin/python scripts/qt_desktop_probe.py --fixture "$format" \
              --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith" \
              --data-dir "$RUNNER_TEMP/qt-$format/data" --out "$RUNNER_TEMP/qt-$format/report.json"
          done
      - name: DMG acceptance probe (mount, install a copy, run)
        run: |
          venv/bin/python scripts/qt_dmg_probe.py \
            --dmg "$(ls dist/qt-desktop/*.dmg | head -1)" \
            --out "$RUNNER_TEMP/qt-dmg"
      - name: Upload the Qt candidate
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-macos
          path: |
            dist/qt-desktop/*.dmg
            build/qt-desktop/release-manifest.json
            build/qt-desktop/dmg_record.json
            build/qt-desktop/desktop_build_info.json
            build/qt-desktop/native_min_os_bundle.json
            docs/qt-beta/release-notes.md
          if-no-files-found: error
      - name: Upload failed Qt probe diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-failure-diagnostics
          path: |
            ${{ runner.temp }}/qt-*/
            build/qt-desktop/*.json
            .regression-logs/
            qt-regression.tsv
          include-hidden-files: true
          if-no-files-found: ignore
