name: Release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        # QtGui/offscreen still links EGL, GL, keyboard, font and D-Bus runtimes.
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install test dependencies
        # 6.12.0 crashes during Qt test teardown and its macOS bindings require
        # macOS 26; use the runtime verified for the macOS 15 release candidate.
        run: python -m pip install --upgrade pip && python -m pip install ".[test]" PySide6==6.11.2
      - name: Compile and import critical modules
        run: |
          python -m py_compile core.py folith/academic_writer.py \
            folith/compliance.py folith/thesis_constraints.py
          python - <<'PY'
          import folith.academic_writer
          import folith.compliance
          import folith.thesis_constraints

          print("critical module compile/import: OK")
          PY
      - name: Check complete UI catalogs
        run: python scripts/check_ui_locales.py
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_regression.py --tsv release-regression.tsv
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-python-${{ matrix.python-version }}
          path: |
            .regression-logs/
            release-regression.tsv
          include-hidden-files: true
          if-no-files-found: ignore

  package:
    name: build and wheel smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Inspect release archives
        run: |
          python scripts/check_release_archives.py dist
          python scripts/release_preflight.py --dist dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/folith"
          "$RUNNER_TEMP/folith/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/folith/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/folith/bin/python" - <<'PY'
          import importlib.util
          from pathlib import Path
          import core
          import folith
          import folith.qt.app

          root = Path(folith.__file__).resolve().parent
          assert "site-packages" in str(root), root
          for rel in ("resources/en_common.txt", "resources/brand/folith-favicon.svg",
                      "resources/brand/folith-mark.svg", "resources/brand/folith-lockup.png",
                      "resources/brand/folith-mark.png", "resources/locales/qt-zh-CN.json"):
              assert (root / rel).is_file(), rel
          assert importlib.util.find_spec("streamlit") is None, "streamlit should not be installed"
          print("installed imports and resources: OK")
          PY
          "$RUNNER_TEMP/folith/bin/folith" --help

  qt-macos:
    # The Qt candidate is built in one interpreter environment: the same venv
    # that runs the tests, builds the app, the DMG, the manifest and the notes.
    # The retired shell's chain installed dependencies with setup-python and then
    # called a script expecting $ROOT/venv (MAC-03), so this job creates the venv
    # it uses and installs the real desktop dependency set.
    name: macOS Qt candidate (build, frozen flow, DMG, release checks)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create the build interpreter and install dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m pip install -r requirements-desktop-build.txt PySide6==6.11.2 "pytest>=8,<9"
      - name: Install the OCR engine used to stage the bundled payload
        run: brew install tesseract
      - name: Build the Qt bundle
        run: bash scripts/build_qt_desktop.sh
      - name: Frozen main flow (import/translate/edit/review/deliver/exit/reopen)
        run: |
          venv/bin/python scripts/qt_desktop_probe.py \
            --data-dir "$RUNNER_TEMP/qt-probe/data" \
            --out "$RUNNER_TEMP/qt-probe/report.json" --fixture both \
            --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith"
      - name: Frozen bundled OCR baseline (eng/chi_sim/ara, no Homebrew on PATH)
        run: |
          venv/bin/python scripts/qt_ocr_baseline_runner.py \
            --out "$RUNNER_TEMP/qt-ocr" \
            --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith"
      - name: Build the DMG
        run: bash scripts/build_qt_dmg.sh
      - name: Release manifest and generated notes for this candidate
        run: |
          venv/bin/python scripts/qt_release_checks.py --write
          venv/bin/python scripts/qt_release_checks.py --write-notes
          venv/bin/python scripts/qt_release_checks.py --check-notes
      - name: Candidate documents and isolated Qt regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          venv/bin/python scripts/qt_acceptance_kit.py --write
          venv/bin/python scripts/qt_acceptance_kit.py --check
          venv/bin/python scripts/run_regression.py -k qt_,text_import --tsv qt-regression.tsv
      - name: New source formats in the frozen main flow
        run: |
          for format in epub txt md; do
            venv/bin/python scripts/qt_desktop_probe.py --fixture "$format" \
              --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith" \
              --data-dir "$RUNNER_TEMP/qt-$format/data" --out "$RUNNER_TEMP/qt-$format/report.json"
          done
      - name: DMG acceptance probe (mount, install a copy, run)
        run: |
          venv/bin/python scripts/qt_dmg_probe.py \
            --dmg "$(ls dist/qt-desktop/*.dmg | head -1)" \
            --out "$RUNNER_TEMP/qt-dmg"
      - name: Upload the Qt candidate
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-macos
          path: |
            dist/qt-desktop/*.dmg
            build/qt-desktop/release-manifest.json
            build/qt-desktop/dmg_record.json
            build/qt-desktop/desktop_build_info.json
            build/qt-desktop/native_min_os_bundle.json
            docs/qt-beta/release-notes.md
          if-no-files-found: error
      - name: Upload failed Qt probe diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-failure-diagnostics
          path: |
            ${{ runner.temp }}/qt-*/
            build/qt-desktop/*.json
            .regression-logs/
            qt-regression.tsv
          include-hidden-files: true
          if-no-files-found: ignore

  tests-windows:
    name: pytest (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" PySide6==6.11.2
      - name: Install the OCR engine and ripgrep used by the test suite
        run: choco install tesseract ripgrep --no-progress -y
      - name: Run the complete Windows regression
        run: python scripts/run_regression.py --tsv release-regression-windows.tsv
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-windows
          path: |
            .regression-logs/
            release-regression-windows.tsv
          include-hidden-files: true
          if-no-files-found: ignore

  qt-windows:
    name: Windows x64 Qt candidate (build, frozen flow, installer, release checks)
    runs-on: windows-latest
    needs: tests-windows
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop-build.txt PySide6==6.11.2 "pytest>=8,<9"
      - name: Install the OCR engine and the installer compiler
        run: choco install tesseract nsis --no-progress -y
      - name: Build the Windows x64 bundle, portable ZIP and installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_qt_windows.ps1 -Python python -Clean
      - name: Frozen main flow (import/translate/edit/review/deliver/exit/reopen)
        shell: powershell
        run: |
          python scripts/qt_desktop_probe.py `
            --data-dir "$env:RUNNER_TEMP/qt-probe/data" `
            --out "$env:RUNNER_TEMP/qt-probe/report.json" --fixture both `
            --frozen-app "$GITHUB_WORKSPACE/dist/qt-windows/Folith/Folith.exe"
      - name: Frozen bundled OCR baseline (eng/chi_sim/ara, no system Tesseract on PATH)
        shell: powershell
        run: |
          python scripts/qt_ocr_baseline_runner.py `
            --out "$env:RUNNER_TEMP/qt-ocr" `
            --frozen-app "$GITHUB_WORKSPACE/dist/qt-windows/Folith/Folith.exe"
      - name: New source formats in the frozen main flow
        shell: powershell
        run: |
          foreach ($format in @("epub", "txt", "md")) {
            python scripts/qt_desktop_probe.py --fixture $format `
              --frozen-app "$GITHUB_WORKSPACE/dist/qt-windows/Folith/Folith.exe" `
              --data-dir "$env:RUNNER_TEMP/qt-$format/data" `
              --out "$env:RUNNER_TEMP/qt-$format/report.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows artifact and release checks
        shell: powershell
        run: |
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          if (-not $installer) { throw "the NSIS installer was not produced" }
          python scripts/check_windows_artifact.py --installer $installer.FullName `
            --out build/qt-windows/windows-artifact-check.json
      - name: Installer round trip (install, upgrade, uninstall keeps user files)
        shell: powershell
        run: |
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          python scripts/check_windows_installer_roundtrip.py --installer $installer.FullName `
            --out build/qt-windows/windows-installer-roundtrip.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write SHA-256 checksums
        run: |
          python scripts/write_release_checksums.py dist/installer/*.zip dist/installer/*.exe --out dist/SHA256SUMS.txt
      - name: Upload the Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-windows
          path: |
            dist/installer/*.zip
            dist/installer/*.exe
            dist/SHA256SUMS.txt
            build/qt-windows/desktop_build_info.json
            build/qt-windows/windows-package.json
            build/qt-windows/windows-artifact-check.json
            build/qt-windows/windows-installer-roundtrip.json
            build/qt-windows/tesseract/tesseract_payload.json
            build/qt-windows/tesseract/tessdata_provenance.json
            ${{ runner.temp }}/qt-probe/
            ${{ runner.temp }}/qt-ocr/
            ${{ runner.temp }}/qt-epub/
            ${{ runner.temp }}/qt-txt/
            ${{ runner.temp }}/qt-md/
          if-no-files-found: error
      - name: Upload failed Windows diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-windows-failure-diagnostics
          path: |
            ${{ runner.temp }}/qt-*/
            build/qt-windows/*.json
            dist/installer/
            .regression-logs/
          include-hidden-files: true
          if-no-files-found: ignore
