name: Release Validation

# Tier 3. A release candidate is valid only when this workflow is green: Main
# Full Regression (called, not skipped), the macOS candidate (bundle, frozen main
# flow, bundled OCR, DMG, release manifest/notes, macOS Qt regression, DMG
# install probe) and the Windows x64 candidate (bundle, frozen flow, OCR,
# installer, install/upgrade/uninstall round trip, checksums).
#
# Runs on version tags, pushes to release/** branches, nightly on main, by hand,
# and on pull requests that target a release/** branch, change packaging inputs
# (see scripts/ci_changes.py) or carry the "ci:release" label. It never publishes
# a GitHub Release.
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Only pull request runs share a group (per PR) and are cancelled by a newer
# push; tag, branch, scheduled and manual runs each get their own group.
concurrency:
  group: release-validation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: decide whether to validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          packaging=$(python3 scripts/ci_changes.py "$BASE_SHA" "$HEAD_SHA" | sed -n 's/^packaging=//p')
          case "$BASE_REF" in release/*) target=true ;; *) target=false ;; esac
          label=$(python3 -c 'import json,os; print(str("ci:release" in json.loads(os.environ["LABELS"] or "[]")).lower())')
          echo "release target=$target packaging=$packaging label=$label"
          if [ "$target" = true ] || [ "$packaging" = true ] || [ "$label" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  full-regression:
    needs: select
    if: needs.select.outputs.run == 'true'
    uses: ./.github/workflows/full-regression.yml

  qt-macos:
    needs: select
    if: needs.select.outputs.run == 'true'
    # The Qt candidate is built in one interpreter environment: the same venv
    # that runs the tests, builds the app, the DMG, the manifest and the notes.
    # The retired shell's chain installed dependencies with setup-python and then
    # called a script expecting $ROOT/venv (MAC-03), so this job creates the venv
    # it uses and installs the real desktop dependency set.
    name: macOS Qt candidate (build, frozen flow, DMG, release checks)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Create the build interpreter and install dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m pip install -r requirements-desktop-build.txt PySide6==6.11.2 "pytest>=8,<9"
      - name: Install the OCR engine used to stage the bundled payload
        run: brew install tesseract
      - name: Build the Qt bundle
        run: bash scripts/build_qt_desktop.sh
      - name: Frozen main flow (import/translate/edit/review/deliver/exit/reopen)
        run: |
          venv/bin/python scripts/qt_desktop_probe.py \
            --data-dir "$RUNNER_TEMP/qt-probe/data" \
            --out "$RUNNER_TEMP/qt-probe/report.json" --fixture both \
            --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith"
      - name: Frozen bundled OCR baseline (eng/chi_sim/ara, no Homebrew on PATH)
        run: |
          venv/bin/python scripts/qt_ocr_baseline_runner.py \
            --out "$RUNNER_TEMP/qt-ocr" \
            --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith"
      - name: Build the DMG
        run: bash scripts/build_qt_dmg.sh
      - name: Release manifest and generated notes for this candidate
        run: |
          venv/bin/python scripts/qt_release_checks.py --write
          venv/bin/python scripts/qt_release_checks.py --write-notes
          venv/bin/python scripts/qt_release_checks.py --check-notes
      - name: Candidate documents and isolated Qt regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          venv/bin/python scripts/qt_acceptance_kit.py --write
          venv/bin/python scripts/qt_acceptance_kit.py --check
          venv/bin/python scripts/run_regression.py -k qt_,text_import --tsv qt-regression.tsv
      - name: New source formats in the frozen main flow
        run: |
          for format in epub txt md; do
            venv/bin/python scripts/qt_desktop_probe.py --fixture "$format" \
              --frozen-app "$GITHUB_WORKSPACE/dist/qt-desktop/Folith.app/Contents/MacOS/Folith" \
              --data-dir "$RUNNER_TEMP/qt-$format/data" --out "$RUNNER_TEMP/qt-$format/report.json"
          done
      - name: DMG acceptance probe (mount, install a copy, run)
        run: |
          venv/bin/python scripts/qt_dmg_probe.py \
            --dmg "$(ls dist/qt-desktop/*.dmg | head -1)" \
            --out "$RUNNER_TEMP/qt-dmg"
      - name: Upload the Qt candidate
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-macos
          path: |
            dist/qt-desktop/*.dmg
            build/qt-desktop/release-manifest.json
            build/qt-desktop/dmg_record.json
            build/qt-desktop/desktop_build_info.json
            build/qt-desktop/native_min_os_bundle.json
            docs/qt-beta/release-notes.md
          if-no-files-found: error
      - name: Upload failed Qt probe diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-failure-diagnostics
          path: |
            ${{ runner.temp }}/qt-*/
            build/qt-desktop/*.json
            .regression-logs/
            qt-regression.tsv
          include-hidden-files: true
          if-no-files-found: ignore

  qt-windows:
    needs: select
    if: needs.select.outputs.run == 'true'
    name: Windows x64 Qt candidate (build, frozen flow, installer, release checks)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop-build.txt PySide6==6.11.2 "pytest>=8,<9"
      - name: Install the OCR engine and the installer compiler
        run: choco install tesseract nsis --no-progress -y
      - name: Locate the installer compiler
        shell: pwsh
        run: |
          $mk = Get-Command makensis -ErrorAction SilentlyContinue
          $roots = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS",
                     "$env:ProgramData\chocolatey\lib")
          if (-not $mk) {
            foreach ($root in $roots) {
              $candidate = Join-Path $root "makensis.exe"
              if (Test-Path -LiteralPath $candidate) {
                $mk = Get-Item -LiteralPath $candidate
                break
              }
            }
          }
          if (-not $mk) {
            $mk = Get-ChildItem $roots -Filter makensis.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $mk) {
            Get-ChildItem $roots -Recurse -ErrorAction SilentlyContinue | Out-String
            throw "makensis not found after installing NSIS"
          }
          $mkPath = if ($mk.Source) { $mk.Source } else { $mk.FullName }
          Split-Path $mkPath -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $mkPath /VERSION
      - name: Build the Windows x64 bundle, portable ZIP and installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_qt_windows.ps1 -Python python -Clean
      - name: Frozen main flow (import/translate/edit/review/deliver/exit/reopen)
        shell: powershell
        run: |
          python scripts/qt_desktop_probe.py `
            --data-dir "$env:RUNNER_TEMP/qt-probe/data" `
            --out "$env:RUNNER_TEMP/qt-probe/report.json" --fixture both `
            --frozen-app "$env:GITHUB_WORKSPACE/dist/qt-windows/Folith/Folith.exe"
      - name: Frozen bundled OCR baseline (eng/chi_sim/ara, no system Tesseract on PATH)
        shell: powershell
        run: |
          python scripts/qt_ocr_baseline_runner.py `
            --out "$env:RUNNER_TEMP/qt-ocr" `
            --frozen-app "$env:GITHUB_WORKSPACE/dist/qt-windows/Folith/Folith.exe"
      - name: New source formats in the frozen main flow
        shell: powershell
        run: |
          foreach ($format in @("epub", "txt", "md")) {
            python scripts/qt_desktop_probe.py --fixture $format `
              --frozen-app "$env:GITHUB_WORKSPACE/dist/qt-windows/Folith/Folith.exe" `
              --data-dir "$env:RUNNER_TEMP/qt-$format/data" `
              --out "$env:RUNNER_TEMP/qt-$format/report.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows artifact and release checks
        shell: powershell
        run: |
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          if (-not $installer) { throw "the NSIS installer was not produced" }
          python scripts/check_windows_artifact.py --installer $installer.FullName `
            --out build/qt-windows/windows-artifact-check.json
      - name: Installer round trip (install, upgrade, uninstall keeps user files)
        shell: powershell
        run: |
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          python scripts/check_windows_installer_roundtrip.py --installer $installer.FullName `
            --out build/qt-windows/windows-installer-roundtrip.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write SHA-256 checksums
        shell: powershell
        # PowerShell does not expand wildcards for native commands; list the
        # release files here and pass real paths.
        run: |
          $assets = @(Get-ChildItem dist/installer/*.zip, dist/installer/*.exe | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw "expected the portable ZIP and the installer, found: $assets" }
          python scripts/write_release_checksums.py @assets --out dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-windows
          path: |
            dist/installer/*.zip
            dist/installer/*.exe
            dist/SHA256SUMS.txt
            build/qt-windows/desktop_build_info.json
            build/qt-windows/windows-package.json
            build/qt-windows/windows-artifact-check.json
            build/qt-windows/windows-installer-roundtrip.json
            build/qt-windows/tesseract/tesseract_payload.json
            build/qt-windows/tesseract/tessdata_provenance.json
            ${{ runner.temp }}/qt-probe/
            ${{ runner.temp }}/qt-ocr/
            ${{ runner.temp }}/qt-epub/
            ${{ runner.temp }}/qt-txt/
            ${{ runner.temp }}/qt-md/
          if-no-files-found: error
      - name: Upload failed Windows diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folith-qt-windows-failure-diagnostics
          path: |
            ${{ runner.temp }}/qt-*/
            build/qt-windows/*.json
            dist/installer/
            .regression-logs/
          include-hidden-files: true
          if-no-files-found: ignore

  gate:
    name: Release Validation
    needs: [select, full-regression, qt-macos, qt-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.select.outputs.run }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          for k, v in needs.items():
              print(f"{k:16} {v['result']}")
          if needs["select"]["result"] != "success":
              sys.exit("::error::could not decide whether to validate")
          if os.environ["SELECTED"] != "true":
              print("not a release candidate: validation not requested for this pull request")
              sys.exit(0)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if bad:
              print(f"::error::not green: {bad}")
              sys.exit(1)
          PY
