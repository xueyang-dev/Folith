[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foliothread"
version = "0.5.0"
description = "Folith·译页 — Agentic Translation Workspace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [
  {name = "Xue Yang"}
]

[project.urls]
Homepage = "https://github.com/xueyang-dev/Folith"
Repository = "https://github.com/xueyang-dev/Folith"
Issues = "https://github.com/xueyang-dev/Folith/issues"

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
test = ["pytest>=8,<9"]
paddle = ["paddleocr==3.7.0", "paddlex==3.7.2", "paddlepaddle==3.3.1"]

[project.scripts]
folith = "gui:main"
# Published package and command kept as a compatibility alias for existing installs.
foliothread = "gui:main"

[tool.setuptools]
py-modules = ["app", "core", "gui"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["folith*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
folith = ["resources/*.txt", "resources/locales/zh-CN.json", "resources/locales/en.json", "resources/locales/es.json", "resources/locales/ru.json", "resources/locales/ar.json", "resources/locales/qt-*.json", "resources/brand/*.svg", "resources/brand/*.png"]
